name: Patch macOS source
on:
  push:
    branches: [ feature/thai-digits-macos-ui ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pristine source and apply patch
        run: |
          git checkout 97ca936555ebcec7be8adafe2f80256f259e0910 -- macos/CursorLingo.swift
          git apply patches/thai_digits.patch
          test "$(wc -l < macos/CursorLingo.swift | tr -d ' ')" = 2804
      - name: Commit and push patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macos/CursorLingo.swift
          git diff --staged --quiet || git commit -m "feat(macos): add Thai digit conversion UI and hotkey"
          git push origin feature/thai-digits-macos-ui
